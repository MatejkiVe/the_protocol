<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Protocol</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyCxxY0gwU_25_GRKu_D6m7QyBahIz-Nveo",
  authDomain: "the-protocol2026.firebaseapp.com",
  projectId: "the-protocol2026",
  storageBucket: "the-protocol2026.firebasestorage.app",
  messagingSenderId: "116030583092",
  appId: "1:116030583092:web:f928e29c957c3acfe37561"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userData = {
  points: 0,
  level: 1,
  habits: [],
  actions: [],
  shop: []
};

function calculateLevel() {
  let newLevel = Math.floor(userData.points / 100) + 1;
  if (newLevel > userData.level) {
    userData.points += 5; // bonus
    userData.level = newLevel;
  } else {
    userData.level = newLevel;
  }
}

async function loadData() {
  const ref = doc(db, "users", currentUser.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) userData = snap.data();
  updateUI();
}

async function saveData() {
  calculateLevel();
  await setDoc(doc(db, "users", currentUser.uid), userData);
  updateUI();
}

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadData();
  }
});

window.signUp = () => {
  createUserWithEmailAndPassword(auth, email.value, password.value);
};

window.login = () => {
  signInWithEmailAndPassword(auth, email.value, password.value);
};

window.logoutUser = () => {
  signOut(auth);
  location.reload();
};

window.addHabit = () => {
  userData.habits.push({ name: newHabit.value, done: false });
  newHabit.value = "";
  saveData();
};

window.toggleHabit = (i) => {
  userData.habits[i].done = !userData.habits[i].done;
  saveData();
};

window.addAction = () => {
  userData.actions.push({
    name: newActionName.value,
    points: parseInt(newActionPoints.value)
  });
  newActionName.value = "";
  newActionPoints.value = "";
  saveData();
};

window.claimAction = (i) => {
  userData.points += userData.actions[i].points;
  saveData();
};

window.addReward = () => {
  userData.shop.push({
    name: newRewardName.value,
    cost: parseInt(newRewardCost.value)
  });
  newRewardName.value = "";
  newRewardCost.value = "";
  saveData();
};

window.buyReward = (i) => {
  if (userData.points >= userData.shop[i].cost) {
    userData.points -= userData.shop[i].cost;
    saveData();
  }
};

function updateUI() {
  document.getElementById("points").innerText = userData.points;
  document.getElementById("level").innerText = userData.level;

  let badge = document.getElementById("levelBadge");
  badge.className = "badge level" + userData.level;

  habitList.innerHTML = "";
  userData.habits.forEach((h,i)=>{
    habitList.innerHTML += `
    <div>
      <input type="checkbox" ${h.done?"checked":""} onchange="toggleHabit(${i})">
      ${h.name}
    </div>`;
  });

  actionList.innerHTML = "";
  userData.actions.forEach((a,i)=>{
    actionList.innerHTML += `
    <div>
      ${a.name} (+${a.points})
      <button onclick="claimAction(${i})">Claim</button>
    </div>`;
  });

  shopList.innerHTML = "";
  userData.shop.forEach((r,i)=>{
    let canBuy = userData.points >= r.cost;
    shopList.innerHTML += `
    <div>
      ${r.name} 
      <span style="color:${canBuy?'#4cff88':'#ff4c4c'}">(${r.cost})</span>
      <button ${canBuy?'':'disabled'} onclick="buyReward(${i})">Buy</button>
    </div>`;
  });
}
</script>

<style>
body {
  margin:0;
  background:#0f1115;
  color:#e4e6eb;
  font-family:sans-serif;
}
.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card {
  background:#1a1d23;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  transition:0.3s;
}
button {
  background:#2f6df6;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
  transition:0.2s;
}
button:hover { transform:scale(1.05); }
button:disabled {
  background:#555;
  cursor:not-allowed;
  opacity:0.6;
}
input {
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  border:none;
  width:100%;
}
.badge {
  width:70px;
  height:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:10px;
  transition:0.5s;
}
.level1 { background:#2f6df6; }
.level2 { background:linear-gradient(45deg,#2f6df6,#4c8bff); }
.level3 { box-shadow:0 0 15px #2f6df6; background:#2f6df6; }
.level4 { box-shadow:0 0 25px #4c8bff; background:linear-gradient(45deg,#2f6df6,#4c8bff); }
.level5 { box-shadow:0 0 40px #4c8bff; background:linear-gradient(90deg,#2f6df6,#4c8bff); }
</style>
</head>

<body>
<div class="container">

<div id="auth" class="card">
<h2>The Protocol</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none;">

<div class="card">
<div id="levelBadge" class="badge level1">⚡</div>
<p>Points: <span id="points">0</span></p>
<p>Level: <span id="level">1</span></p>
<button onclick="logoutUser()">Logout</button>
</div>

<div class="card">
<h3>Habits</h3>
<div id="habitList"></div>
<input id="newHabit" placeholder="New Habit">
<button onclick="addHabit()">Add Habit</button>
</div>

<div class="card">
<h3>Actions</h3>
<div id="actionList"></div>
<input id="newActionName" placeholder="Action Name">
<input id="newActionPoints" type="number" placeholder="Points">
<button onclick="addAction()">Add Action</button>
</div>

<div class="card">
<h3>Shop</h3>
<div id="shopList"></div>
<input id="newRewardName" placeholder="Reward Name">
<input id="newRewardCost" type="number" placeholder="Cost">
<button onclick="addReward()">Add Reward</button>
</div>

</div>
</div>
</body>
</html>
