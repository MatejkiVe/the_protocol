<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Protocol</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 KEEP YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyCxxY0gwU_25_GRKu_D6m7QyBahIz-Nveo",
  authDomain: "the-protocol2026.firebaseapp.com",
  projectId: "the-protocol2026",
  storageBucket: "the-protocol2026.firebasestorage.app",
  messagingSenderId: "116030583092",
  appId: "1:116030583092:web:f928e29c957c3acfe37561"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let activeTab = "dashboard";

let userData = {
  points: 0,
  level: 1,
  habits: [],
  actions: [],
  shop: []
};

function calculateLevel() {
  let newLevel = Math.floor(userData.points / 100) + 1;
  if (newLevel > userData.level) {
    userData.points += 5;
    userData.level = newLevel;
  } else {
    userData.level = newLevel;
  }
}

async function loadData() {
  const snap = await getDoc(doc(db, "users", currentUser.uid));
  if (snap.exists()) userData = snap.data();
  updateUI();
}

async function saveData() {
  calculateLevel();
  await setDoc(doc(db, "users", currentUser.uid), userData);
  updateUI();
}

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadData();
  }
});

window.signUp = () => createUserWithEmailAndPassword(auth, email.value, password.value);
window.login = () => signInWithEmailAndPassword(auth, email.value, password.value);
window.logoutUser = () => { signOut(auth); location.reload(); };

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
}

function updateUI() {
  document.getElementById("points").innerText = userData.points;
  document.getElementById("level").innerText = userData.level;

  let progress = userData.points % 100;
  document.getElementById("progressBar").style.width = progress + "%";

  renderList("habitList", userData.habits, "habit");
  renderList("actionList", userData.actions, "action");
  renderList("shopList", userData.shop, "shop");
}

function renderList(containerId, list, type) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  list.forEach((item, i) => {
    let extra = "";
    if (type === "action") extra = `+${item.points}`;
    if (type === "shop") {
      let canBuy = userData.points >= item.cost;
      extra = `<span style="color:${canBuy ? '#4cff88' : '#ff4c4c'}">${item.cost}</span>`;
    }
    container.innerHTML += `
      <div class="item" onclick="openModal('${type}', ${i})">
        <span>${item.name}</span>
        <span>${extra}</span>
      </div>`;
  });
}

window.addItem = function(type) {
  let name = document.getElementById(type + "Name").value;
  if (!name) return;

  if (type === "habit") userData.habits.push({ name });
  if (type === "action") {
    let pts = parseInt(document.getElementById("actionPoints").value);
    userData.actions.push({ name, points: pts });
  }
  if (type === "shop") {
    let cost = parseInt(document.getElementById("shopCost").value);
    userData.shop.push({ name, cost });
  }

  document.getElementById(type + "Name").value = "";
  if (type !== "habit") document.getElementById(type + (type==="action"?"Points":"Cost")).value="";
  saveData();
};

window.claimAction = function(i) {
  userData.points += userData.actions[i].points;
  saveData();
};

window.buyItem = function(i) {
  if (userData.points >= userData.shop[i].cost) {
    userData.points -= userData.shop[i].cost;
    saveData();
  }
};

let modalType = null;
let modalIndex = null;

window.openModal = function(type, index) {
  modalType = type;
  modalIndex = index;
  let item = userData[type + "s"][index];
  document.getElementById("modalName").value = item.name;
  document.getElementById("modalValue").value = item.points || item.cost || "";
  document.getElementById("modal").classList.add("show");
};

window.saveModal = function() {
  let item = userData[modalType + "s"][modalIndex];
  item.name = document.getElementById("modalName").value;
  if (modalType === "action") item.points = parseInt(document.getElementById("modalValue").value);
  if (modalType === "shop") item.cost = parseInt(document.getElementById("modalValue").value);
  document.getElementById("modal").classList.remove("show");
  saveData();
};

window.deleteModal = function() {
  userData[modalType + "s"].splice(modalIndex,1);
  document.getElementById("modal").classList.remove("show");
  saveData();
};

window.closeModal = () => document.getElementById("modal").classList.remove("show");
</script>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#0c111b;
  color:#e6edf3;
}

.topbar {
  background:#0f1a2e;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 30px rgba(0,0,0,0.6);
}

.logo {
  font-weight:700;
  letter-spacing:4px;
}

.logo small {
  display:block;
  font-weight:400;
  font-size:12px;
  letter-spacing:2px;
  opacity:0.6;
}

.nav button {
  background:none;
  border:none;
  color:#cbd5e1;
  margin-left:20px;
  font-size:14px;
  cursor:pointer;
}

.nav button:hover {
  color:white;
}

.container {
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

.card {
  background:#121b2d;
  padding:25px;
  border-radius:20px;
  margin-bottom:30px;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  transition:0.3s;
}

.progress {
  height:10px;
  background:#1f2a44;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progress div {
  height:100%;
  background:#142d55;
  width:0%;
  transition:0.5s;
}

.tab { display:none; animation:fade 0.3s ease-in; }
.tab.active { display:block; }

@keyframes fade { from {opacity:0;} to {opacity:1;} }

.item {
  display:flex;
  justify-content:space-between;
  padding:12px;
  margin:8px 0;
  background:#0f1a2e;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.item:hover {
  background:#142d55;
}

input {
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  width:100%;
  background:#0f1a2e;
  color:white;
}

button.primary {
  background:#142d55;
  border:none;
  padding:10px 18px;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
  color:white;
}

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.modal.show {
  opacity:1;
  pointer-events:auto;
}

.modal-content {
  background:#121b2d;
  padding:30px;
  border-radius:20px;
  width:350px;
}
</style>
</head>

<body>

<div id="auth" class="container">
  <div class="card">
    <h2>T H E&nbsp;&nbsp;P R O T O C O L</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="primary" onclick="signUp()">Sign Up</button>
    <button class="primary" onclick="login()">Login</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="logo">
      T H E&nbsp;&nbsp;P R O T O C O L
      <small>Personal Operating System</small>
    </div>
    <div class="nav">
      <button onclick="switchTab('dashboard')">Dashboard</button>
      <button onclick="switchTab('habits')">Habits</button>
      <button onclick="switchTab('actions')">Actions</button>
      <button onclick="switchTab('shop')">Shop</button>
      <button onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="container">

    <div id="dashboard" class="tab active">
      <div class="card">
        <h3>Level <span id="level">1</span></h3>
        <p>Points: <span id="points">0</span></p>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
    </div>

    <div id="habits" class="tab">
      <div class="card">
        <h3>Habits</h3>
        <div id="habitList"></div>
        <input id="habitName" placeholder="New Habit">
        <button class="primary" onclick="addItem('habit')">Add Habit</button>
      </div>
    </div>

    <div id="actions" class="tab">
      <div class="card">
        <h3>Actions</h3>
        <div id="actionList"></div>
        <input id="actionName" placeholder="Action Name">
        <input id="actionPoints" type="number" placeholder="Points">
        <button class="primary" onclick="addItem('action')">Add Action</button>
      </div>
    </div>

    <div id="shop" class="tab">
      <div class="card">
        <h3>Shop</h3>
        <div id="shopList"></div>
        <input id="shopName" placeholder="Reward Name">
        <input id="shopCost" type="number" placeholder="Cost">
        <button class="primary" onclick="addItem('shop')">Add Reward</button>
      </div>
    </div>

  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Edit Item</h3>
    <input id="modalName">
    <input id="modalValue" placeholder="Value">
    <button class="primary" onclick="saveModal()">Save</button>
    <button class="primary" onclick="deleteModal()">Delete</button>
    <button class="primary" onclick="closeModal()">Cancel</button>
  </div>
</div>

</body>
</html>
